# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target_arch: arm64
            android_target: arm64-v8a
          - target_arch: arm
            android_target: armeabi-v7a
          - target_arch: x64
            android_target: x86_64
          - target_arch: x86
            android_target: x86

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Prepare for build
        run: bash build.sh

      # Runs a set of commands using the runners shell
      - name: Build ${{ matrix.android_target }}
        run: |
          export TARGET_ARCH=${{ matrix.target_arch }}
          export ANDROID_TARGET=${{ matrix.android_target }}
          bash build_arch.sh
      - name: Upload result
        uses: actions/upload-artifact@v4.6.2
        with:
           name: angle-${{ matrix.android_target }}
           path: build_out/

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download result
        uses: actions/download-artifact@v4
        with:
          pattern: angle-*
          path: build_out/
          merge-multiple: true
      - name: Upload result
        uses: actions/upload-artifact@v4.6.2
        with:
           name: angle
           path: build_out/
      - name: Create AAR
        run: |
          bash create_aar.sh
      - name: Upload result
        uses: actions/upload-artifact@v4.6.2
        with:
           name: angle-aar
           path: angle.aar


